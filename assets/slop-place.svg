<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>slop-place</title>

  <defs>
    <!-- The slop: a warm, faintly unappetising green. -->
    <linearGradient id="slop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#A3D178"/>
      <stop offset="0.5"  stop-color="#7CB854"/>
      <stop offset="1"    stop-color="#588C38"/>
    </linearGradient>

    <!-- Ceramic, lit from above. -->
    <linearGradient id="bowl" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0"   stop-color="#FAF7F1"/>
      <stop offset="0.5" stop-color="#DED7C9"/>
      <stop offset="1"   stop-color="#B3AA99"/>
    </linearGradient>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#333B48"/>
      <stop offset="1" stop-color="#1C212A"/>
    </linearGradient>

    <!-- The slop is clipped to the bowl's inner cavity. -->
    <clipPath id="cavity">
      <path d="M132 254 h248 a124 124 0 0 1 -248 0 z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Bowl body -->
  <path d="M120 250 h272 a136 136 0 0 1 -272 0 z" fill="url(#bowl)"/>

  <!-- Inner cavity, a shade darker so the bowl reads as hollow. -->
  <path d="M132 254 h248 a124 124 0 0 1 -248 0 z" fill="#8E8C88"/>

  <!-- Slop, sitting well below the rim so the ceramic still shows. -->
  <g clip-path="url(#cavity)">
    <path d="M110 306
             c24 -18 48 -18 72 0
             s48 18 72 0
             s48 -18 72 0
             s48 18 72 0
             V440 H110 Z"
          fill="url(#slop)"/>
    <path d="M110 306 c24 -18 48 -18 72 0 s48 18 72 0 s48 -18 72 0 s48 18 72 0"
          fill="none" stroke="#C4E5A6" stroke-width="8" stroke-linecap="round"
          opacity="0.7"/>
  </g>

  <!-- Rim, drawn over both so it caps the bowl cleanly. -->
  <rect x="112" y="238" width="288" height="26" rx="13" fill="#F7F3EB"/>
  <rect x="112" y="238" width="288" height="10" rx="5"  fill="#FFFFFF" opacity="0.65"/>

  <!-- Three drips escaping the bowl. -->
  <g fill="url(#slop)">
    <path d="M188 392 c0 -22 14 -30 14 -46 c0 16 14 24 14 46 a14 14 0 0 1 -28 0 z"/>
    <path d="M245 428 c0 -18 11 -25 11 -38 c0 13 11 20 11 38 a11 11 0 0 1 -22 0 z"/>
    <path d="M296 400 c0 -20 13 -28 13 -43 c0 15 13 23 13 43 a13 13 0 0 1 -26 0 z"/>
  </g>

  <!-- Steam, rising in three loose curls. -->
  <g fill="none" stroke="#8FBF6A" stroke-width="15" stroke-linecap="round" opacity="0.8">
    <path d="M196 196 c-20 -24 20 -44 0 -70"/>
    <path d="M256 180 c-22 -28 22 -50 0 -80"/>
    <path d="M316 196 c-20 -24 20 -44 0 -70"/>
  </g>
</svg>
